<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080812"/>
      <stop offset="100%" stop-color="#020205"/>
    </linearGradient>

    <!-- Border Ring Gradient (Saffron -> Blue -> Emerald) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Laser Glow Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Text -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>

  <!-- Scanning Document Corner Brackets -->
  <path d="M 90 140 L 90 90 L 140 90" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round"/>
  <path d="M 422 140 L 422 90 L 372 90" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round"/>
  <path d="M 90 372 L 90 422 L 140 422" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round"/>
  <path d="M 422 372 L 422 422 L 372 422" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round"/>

  <!-- Central "अ" Emblem with Glow -->
  <text x="256" y="340" 
        font-family="'Plus Jakarta Sans', 'Outfit', 'Noto Sans Devanagari', -apple-system, sans-serif" 
        font-size="240" 
        font-weight="900" 
        fill="#FFFFFF" 
        text-anchor="middle"
        filter="url(#glow)">अ</text>

  <!-- Laser Beam Line -->
  <rect x="60" y="260" width="392" height="6" rx="3" fill="url(#laserGrad)"/>
  <circle cx="256" cy="263" r="8" fill="#FFFFFF" opacity="0.85"/>
</svg>
